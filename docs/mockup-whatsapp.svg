<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="screenwa"><rect x="20" y="20" width="340" height="740" rx="42"/></clipPath>
    <filter id="shwa" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00000022"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="364" height="764" rx="52" fill="#0b0b0c"/>

  <g clip-path="url(#screenwa)">
    <rect x="20" y="20" width="340" height="740" fill="#ffffff"/>
    <!-- chat background (beige WhatsApp) -->
    <rect x="20" y="100" width="340" height="600" fill="#e5ddd5"/>

    <!-- header WhatsApp (verde) -->
    <rect x="20" y="20" width="340" height="80" fill="#075e54"/>

    <!-- Bolla 1: nuovo guasto (in entrata, bianca a sinistra) -->
    <rect x="34" y="120" width="278" height="118" rx="12" fill="#ffffff" filter="url(#shwa)"/>
    <path d="M34 132 l-10 -6 10 -6 z" fill="#ffffff"/>
    <text x="50" y="146" font-size="14" font-weight="700" fill="#c0392b">🔴 Nuovo guasto/segnalazione</text>
    <text x="50" y="172" font-size="13" font-weight="700" fill="#111">Ascensore scala B</text>
    <text x="50" y="192" font-size="12" fill="#666">Problema · aperto 12/03/2026</text>
    <text x="50" y="214" font-size="13" fill="#222">Stato: Aperto</text>
    <text x="298" y="230" font-size="10" fill="#9aa0a6" text-anchor="end">9:41</text>

    <!-- Bolla 2: nuovo documento con allegato PDF -->
    <rect x="34" y="254" width="278" height="150" rx="12" fill="#ffffff" filter="url(#shwa)"/>
    <path d="M34 266 l-10 -6 10 -6 z" fill="#ffffff"/>
    <text x="50" y="282" font-size="14" font-weight="700" fill="#111">📄 Nuovo documento</text>
    <text x="50" y="306" font-size="12" fill="#666">📁 Verbali assemblea</text>

    <!-- allegato PDF dentro la bolla -->
    <rect x="48" y="320" width="250" height="52" rx="10" fill="#f3f4f6"/>
    <rect x="60" y="332" width="30" height="30" rx="6" fill="#e74c3c"/>
    <text x="75" y="352" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">PDF</text>
    <text x="100" y="343" font-size="12" fill="#111">Verbale_2026-03-12.pdf</text>
    <text x="100" y="360" font-size="10.5" fill="#8a8f94">284 KB · PDF</text>
    <text x="298" y="396" font-size="10" fill="#9aa0a6" text-anchor="end">9:41  ✓✓</text>

    <!-- Bolla 3: test notifica -->
    <rect x="34" y="420" width="278" height="56" rx="12" fill="#ffffff" filter="url(#shwa)"/>
    <path d="M34 432 l-10 -6 10 -6 z" fill="#ffffff"/>
    <text x="50" y="446" font-size="13" fill="#111">🔔 Test notifica MioCondominio</text>
    <text x="298" y="468" font-size="10" fill="#9aa0a6" text-anchor="end">9:41  ✓✓</text>

    <!-- input bar -->
    <rect x="20" y="700" width="340" height="60" fill="#e5ddd5"/>
    <rect x="34" y="712" width="256" height="36" rx="18" fill="#ffffff"/>
    <text x="52" y="735" fill="#9aa0a6" font-size="13">Messaggio</text>
    <circle cx="322" cy="730" r="20" fill="#128c7e"/>
    <path d="M314 730 l14 -6 -4 6 4 6 z" fill="#fff"/>
  </g>

  <rect x="140" y="20" width="100" height="26" rx="13" fill="#0b0b0c"/>
  <text x="40" y="42" font-size="13" font-weight="600" fill="#fff">9:41</text>
  <text x="332" y="42" font-size="12" fill="#fff" text-anchor="end">◗ 🔋</text>

  <text x="36" y="83" font-size="22" fill="#ffffff">‹</text>
  <circle cx="70" cy="76" r="16" fill="#25d366"/>
  <text x="70" y="81" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">MC</text>
  <text x="96" y="72" font-size="14" font-weight="700" fill="#ffffff">MioCondominio</text>
  <text x="96" y="88" font-size="11" fill="#cfe9e2">online</text>
</svg>
