    <rect x="34" y="356" width="272" height="40" rx="12" fill="#ffffff" fill-opacity="0.95" filter="url(#sh2)"/>
    <text x="170" y="381" font-size="14" fill="#2b7cd3" font-weight="600" text-anchor="middle">⬇️  Scarica</text>

    <!-- Documento consegnato in chat -->
    <rect x="34" y="410" width="272" height="60" rx="16" fill="#ffffff" filter="url(#sh2)"/>
    <rect x="48" y="424" width="32" height="32" rx="6" fill="#e74c3c"/>
    <text x="64" y="445" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">PDF</text>
