    <line x1="20" y1="100" x2="360" y2="100" stroke="#e2e2e2" stroke-width="1"/>

    <!-- Notifica 1: nuovo guasto -->
    <rect x="34" y="118" width="272" height="120" rx="16" fill="#ffffff" filter="url(#sh2)"/>
    <text x="50" y="146" font-size="14" font-weight="700" fill="#c0392b">🔴 Nuovo guasto/segnalazione</text>
