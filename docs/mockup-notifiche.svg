    <text x="92" y="456" font-size="11" fill="#8a8f94">284 KB · PDF</text>

    <!-- input bar -->
    <rect x="20" y="700" width="340" height="60" fill="#ffffff"/>
    <rect x="40" y="716" width="250" height="30" rx="15" fill="#f0f0f0"/>
    <text x="54" y="736" fill="#9aa0a6" font-size="13">Messaggio…</text>
    <circle cx="322" cy="731" r="16" fill="#4aa3df"/>
    <path d="M316 731 l10 -5 -3 5 3 5 z" fill="#fff"/>
