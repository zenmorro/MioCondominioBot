    <text x="50" y="214" font-size="13" fill="#222">Stato: Aperto</text>
    <text x="290" y="230" font-size="10" fill="#9aa0a6" text-anchor="end">9:41</text>

    <!-- Notifica 2: nuovo documento + bottone Scarica -->
    <rect x="34" y="252" width="272" height="96" rx="16" fill="#ffffff" filter="url(#sh2)"/>
